# Build and checks only; nothing is deployed or released.
# The game ROM is user-supplied and never in git or CI, so RecompiledFuncs/ and rsp/musyx.cpp (both generated from it)
# don't exist here: CI builds every library and every object file of the exe except the two that include that output,
# and stops short of linking.
#
# The submodules and the build directory are cached together, keyed on the runner image, the submodule commits and the
# runtime patches. On an exact hit nothing is cloned and ninja finds the libraries up to date (the cache keeps mtimes,
# so every submodule source is older than what was built from it); only the game's own sources compile, and sccache
# serves the ones the PR didn't touch. Otherwise the newest cache for the OS is restored, the submodules are updated in
# place and ninja rebuilds what changed.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: No ROM data tracked, TOML parses, Python compiles
        run: python -I tools/ci/check_repo.py
      - name: Runtime patches apply to the pinned N64ModernRuntime
        run: |
          git submodule update --init --depth 1 rush2049/lib/N64ModernRuntime
          bash tools/rush2049/apply_runtime_patches.sh
          bash tools/rush2049/apply_runtime_patches.sh | grep -q "already applied"

  build:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Cache key
        id: key
        shell: bash
        run: |
          prefix="build-v1-$ImageOS-"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "key=$prefix$ImageVersion-$(git ls-tree HEAD rush2049/lib | git hash-object --stdin)-${{ hashFiles('rush2049/runtime-patches/*.patch') }}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: cache
        with:
          path: |
            .git/modules
            rush2049/lib/N64ModernRuntime
            rush2049/lib/RecompFrontend
            rush2049/lib/rt64
            rush2049/build
          key: ${{ steps.key.outputs.key }}
          restore-keys: ${{ steps.key.outputs.prefix }}
      # In parallel: actions/checkout's submodules option clones the ~30 nested repos one at a time (~90 s).
      - name: Submodules
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: git -c protocol.version=2 submodule update --init --recursive --force --depth 1 --jobs 8
      - name: Apply runtime patches
        shell: bash
        run: bash tools/rush2049/apply_runtime_patches.sh
      # The dev box uses CMake 3.31 (docs/03-local-env.md): CMake 4 rejects the old submodules' cmake_minimum_required.
      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.31.0"
          ninjaVersion: "^1.13.0"
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: Stand in for the ROM-generated sources
        shell: bash
        run: |
          mkdir -p rush2049/RecompiledFuncs rush2049/rsp
          echo "// CI placeholder: generated from the ROM on a real build" > rush2049/RecompiledFuncs/ci_placeholder.c
          echo "// CI placeholder: generated from the ROM on a real build" > rush2049/rsp/musyx.cpp
      - name: DIAG before configure
        shell: bash
        run: ninja -C rush2049/build -t commands lib/RecompFrontend/recompui/lib/lunasvg/plutovg/CMakeFiles/plutovg.dir/source/plutovg-blend.c.obj | tail -1
      - name: Configure
        run: |
          clang-cl --version
          cmake -S rush2049 -B rush2049/build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
      - name: DIAG why ninja rebuilds
        shell: bash
        run: ninja -C rush2049/build -t commands lib/RecompFrontend/recompui/lib/lunasvg/plutovg/CMakeFiles/plutovg.dir/source/plutovg-blend.c.obj | tail -1
      - name: Build runtime, renderer and frontend libraries
        run: ninja -C rush2049/build librecomp ultramodern rt64 recompui recompinput nfd
      - name: Compile the game's own sources
        shell: bash
        run: |
          objs=$(ninja -C rush2049/build -t targets all |
            grep -oE '^CMakeFiles/Rush2049Recompiled\.dir/[^:]+\.obj' | grep -vE 'register_overlays|/rsp/')
          [ -n "$objs" ] || { echo "no object targets found"; exit 1; }
          echo "$objs"
          ninja -C rush2049/build $objs
      - name: sccache stats
        if: always()
        run: sccache --show-stats

  # Same build as above, on Linux with clang (what a Steam Deck build would be).
  build-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Cache key
        id: key
        run: |
          prefix="build-v1-$ImageOS-"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "key=$prefix$ImageVersion-$(git ls-tree HEAD rush2049/lib | git hash-object --stdin)-${{ hashFiles('rush2049/runtime-patches/*.patch') }}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: cache
        with:
          path: |
            .git/modules
            rush2049/lib/N64ModernRuntime
            rush2049/lib/RecompFrontend
            rush2049/lib/rt64
            rush2049/build
          key: ${{ steps.key.outputs.key }}
          restore-keys: ${{ steps.key.outputs.prefix }}
      - name: Submodules
        if: steps.cache.outputs.cache-hit != 'true'
        run: git -c protocol.version=2 submodule update --init --recursive --force --depth 1 --jobs 8
      - name: Apply runtime patches
        run: bash tools/rush2049/apply_runtime_patches.sh
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld libsdl2-dev libgtk-3-dev libfreetype-dev
      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.31.0"
          ninjaVersion: "^1.13.0"
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: Stand in for the ROM-generated sources
        run: |
          mkdir -p rush2049/RecompiledFuncs rush2049/rsp
          echo "// CI placeholder: generated from the ROM on a real build" > rush2049/RecompiledFuncs/ci_placeholder.c
          echo "// CI placeholder: generated from the ROM on a real build" > rush2049/rsp/musyx.cpp
      - name: Configure
        run: |
          clang --version
          cmake -S rush2049 -B rush2049/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
      - name: DIAG why ninja rebuilds
        shell: bash
        run: ninja -C rush2049/build -t commands lib/RecompFrontend/recompui/lib/lunasvg/plutovg/CMakeFiles/plutovg.dir/source/plutovg-blend.c.obj | tail -1
      - name: Build runtime, renderer and frontend libraries
        run: ninja -C rush2049/build librecomp ultramodern rt64 recompui recompinput nfd
      - name: Compile the game's own sources
        run: |
          objs=$(ninja -C rush2049/build -t targets all |
            grep -oE '^CMakeFiles/Rush2049Recompiled\.dir/[^:]+\.o' | grep -vE 'register_overlays|/rsp/')
          [ -n "$objs" ] || { echo "no object targets found"; exit 1; }
          echo "$objs"
          ninja -C rush2049/build $objs
      - name: sccache stats
        if: always()
        run: sccache --show-stats
