# Example mod for San Francisco Rush 2049: Recompiled, and a starting point for your own. Build it with
# `make` and `RecompModTool mod.toml build` (docs/rush2049.md, "Mods"), then put build/*.nrm in the game's
# mods folder.

[manifest]
# Unique ID: long enough that no other mod will pick it. The mod menu shows display_name instead.
id = "rush2049_hello_mod"
version = "1.0.0"
display_name = "Hello Mod"
description = """
Example mod for San Francisco Rush 2049: Recompiled. Prints to the console when the game boots, and every \
ten seconds of racing."""
short_description = "Example mod: prints to the console."
authors = [ "San Francisco Rush 2049: Recompiled" ]
game_id = "rush2049"
minimum_recomp_version = "0.0.1"
dependencies = []
optional_dependencies = []
native_libraries = []

[inputs]
elf_path = "build/mod.elf"
mod_filename = "rush2049_hello_mod"
func_reference_syms_file = "../../syms/rush2049/rush2049.us.syms.toml"
data_reference_syms_files = [ "../../syms/rush2049/rush2049.us.datasyms.toml" ]
additional_files = []
