# RSPRecomp config for the MusyX v1 audio microcode ("N64 RSP mixer V1.1", Factor 5).
# The game's audio tasks point ucode at 0x8002A050 (boot segment, ROM 0x1000 + vram - 0x80000400) with
# ucode_size 0x1000; rspboot loads it at IMEM 0x080. Code ends at IMEM 0xFB4 (constants follow). The ucode's DMEM image is at 0x8002E210.
# Every indirect jump in it (jr $30, jr $8) returns through a saved $ra, so jal return addresses cover them.
text_offset = 0x2AC50
text_size = 0xF34
text_address = 0x04001080
rom_file_path = "../roms/rush2049.us.z64"
output_file_path = "rsp/musyx.cpp"
output_function_name = "musyx_mixer"
