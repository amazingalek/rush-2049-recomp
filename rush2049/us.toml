# N64Recomp config for San Francisco Rush 2049 (USA, NRUE).
# Run tools/rush2049/extract.py and tools/rush2049/gen_syms.py first.

[input]
entrypoint = 0x80000400
# Paths are relative to this file.
output_func_path = "RecompiledFuncs"
symbols_file_path = "../syms/rush2049/rush2049.us.syms.toml"
rom_file_path = "../roms/rush2049.us.recomp.z64"
recomp_include = "#include \"recomp.h\"\n#include \"rush2049_hooks.h\""

[patches]
stubs = [
    # cache 0x0D loop over a buffer; caches don't exist on PC.
    "dcache_create_dirty_8002C5E0",
    # Hand-written DSP asm island (gen_syms.py ASM_ISLANDS); TODO reimplement in C.
    "func_800277D0", "func_800278C4", "func_80027B44",
    # Only called by osMotorInit, which the runtime reimplements; calls __osContAddressCrc, which it doesn't.
    "__osMakeMotorData",
]
ignored = []

# The game inflates its own code (raw deflate) with func_80006814(rom, dst, flag): the main segment at boot
# and the two overlays at 0x8038A400 later. Tell the runtime about recompiled code once it is in RDRAM
# (src/code_loading.cpp maps the original ROM address to the extracted section).
[[patches.hook]]
func = "func_80006814"
before_vram = 0x80006814
text = "    rush2049_inflate_begin(rdram, ctx);"

# After osInvalICache over the output; dst is still in the caller's arg slot at 0x4C($sp).
[[patches.hook]]
func = "func_80006814"
before_vram = 0x80006954
text = "    rush2049_inflate_end(rdram, ctx);"

# lw $zero, 0x0($t8) (from 0x8002EB94): a load with no effect that N64Recomp emits as "0 = MEM_W(...)".
[[patches.instruction]]
func = "func_800CADA4"
vram = 0x800CB408
value = 0x00000000

# Boot main reads 16 words from cart address 0xFFB000 (past the end of the 12 MiB ROM) into a stack buffer it
# never uses. Skip the read.
[[patches.instruction]]
func = "func_800020F0"
vram = 0x80002124
value = 0x00000000

# Busy-wait loops: a bnel/beql to itself that reloads a value in its delay slot until another thread changes it
# (mostly the outstanding graphics-task counter, s16 at 0x8002EB70). ultramodern runs one game thread at a time
# and only delivers RSP/RDP/VI events inside OS calls, so these never end on their own. Each yields while its
# condition holds. Generated by tools/rush2049/find_spins.py --toml; rerun it after symbol changes.
[[patches.hook]]
func = "func_80011848"
before_vram = 0x80011868
text = "    if (ctx->r15 != 0) yield_self_1ms(rdram);"

[[patches.hook]]
func = "func_80014140"
before_vram = 0x8001416C
text = "    if ((int32_t)ctx->r24 > 0) yield_self_1ms(rdram);"

[[patches.hook]]
func = "func_80096130"
before_vram = 0x80096184
text = "    if (ctx->r14 != 0) yield_self_1ms(rdram);"

[[patches.hook]]
func = "func_800A4B6C"
before_vram = 0x800A4BA0
text = "    if (ctx->r15 != 0) yield_self_1ms(rdram);"

[[patches.hook]]
func = "func_800A4B6C"
before_vram = 0x800A4BC8
text = "    if (ctx->r25 != 0) yield_self_1ms(rdram);"

[[patches.hook]]
func = "func_800A501C"
before_vram = 0x800A5094
text = "    if (ctx->r15 != 0) yield_self_1ms(rdram);"

[[patches.hook]]
func = "func_800A5BB8"
before_vram = 0x800A5C2C
text = "    if (ctx->r15 != 0) yield_self_1ms(rdram);"

[[patches.hook]]
func = "func_800E7038"
before_vram = 0x800E7114
text = "    if (ctx->r2 == ctx->r25) yield_self_1ms(rdram);"

[[patches.hook]]
func = "func_800FD464"
before_vram = 0x800FD500
text = "    if (ctx->r24 != 0) yield_self_1ms(rdram);"

[[patches.hook]]
func = "ovl1_func_8038B388"
before_vram = 0x8038B3DC
text = "    if (ctx->r24 != 0) yield_self_1ms(rdram);"

[[patches.hook]]
func = "ovl1_func_8038B3EC"
before_vram = 0x8038B4E8
text = "    if (ctx->r25 != 0) yield_self_1ms(rdram);"

[[patches.hook]]
func = "ovl1_func_8038B940"
before_vram = 0x8038BA20
text = "    if (ctx->r15 != 0) yield_self_1ms(rdram);"

[[patches.hook]]
func = "ovl1_func_8038B940"
before_vram = 0x8038BA84
text = "    if (ctx->r15 != 0) yield_self_1ms(rdram);"
# ---- end of generated busy-wait hooks ----

# Audio thread (func_8008AA40) spin-waits for the scheduler's current task (sc+0x274) to change from the one at
# 0x8002AFA0 before running its audio frame. The scheduler only advances on an RDP-done message, which ultramodern
# delivers inside OS calls, so the spin would hang the game at boot when it catches a graphics task in flight.
[[patches.hook]]
func = "func_8008AA40"
before_vram = 0x8008AB44
text = "    if (MEM_W(0x274, ctx->r16) == ctx->r2) yield_self_1ms(rdram);"

# DEBUG: count scheduler messages (0x29A retrace, 0x29B RSP done, 0x29C RDP done, 0x29E audio task queued).
[[patches.hook]]
func = "func_8000063C"
before_vram = 0x80000664
text = "    rush2049_probe_sched_msg(rdram, MEM_W(0x24, ctx->r29));"
